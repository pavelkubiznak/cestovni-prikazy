name: keep-alive

# Udržuje Supabase free-tarif databázi aktivní a HLÍDÁ, jestli je vůbec dostupná.
#
# POUČENÍ Z 3. 8. 2026: projekt se uspal, i když tenhle ping 23. i 27. 7. vracel HTTP 200
# — čtecí dotaz se Supabase jako „aktivita" spolehlivě nepočítá. Proto pingujeme DENNĚ
# a při nedostupnosti workflow SELŽE (GitHub pošle e-mail). Hlavní pojistkou je ale
# denní záloha dat na Drive (server sintera-radar), ne tenhle workflow.

on:
  schedule:
    - cron: '23 7 * * *'     # každý den 07:23 UTC
  workflow_dispatch:          # umožní ruční spuštění tlačítkem "Run workflow"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ping Supabase (udrží databázi aktivní + ověří dostupnost)
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
            "https://tgwlzmrdirqrqtqgprod.supabase.co/rest/v1/cp_shared?select=id&limit=1" \
            -H "apikey: sb_publishable_JqSGar-QkP6OC02bkZNQNw_1b0B1wpo" || echo "000")
          echo "Supabase ping: HTTP $code"
          case "$code" in
            200|401|403)
              echo "OK — databáze odpověděla." ;;
            000)
              echo "::error::Databáze NEODPOVÍDÁ (host se nepřeložil) — projekt je nejspíš POZASTAVENÝ."
              echo "Obnova: Supabase dashboard → org 'Cestovni prikazy' → projekt cestovni-prikazy → Resume project (trvá ~1 min)."
              exit 1 ;;
            *)
              echo "::error::Neočekávaný stav HTTP $code — zkontroluj projekt v Supabase dashboardu."
              exit 1 ;;
          esac

      - name: Heartbeat (jen občas — udrží i tento GitHub cron naživu >60 dní)
        run: |
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Poslední commit v repu byl před $days dny."
          if [ "$days" -ge 50 ]; then
            date -u +%FT%TZ > .github/last-keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-keepalive.txt
            git commit -m "keepalive heartbeat [skip ci]"
            git push
            echo "Heartbeat commit vytvořen (repo bylo dlouho nečinné)."
          else
            echo "Heartbeat není potřeba — repo je aktivní."
          fi
